plugins {
    id 'com.android.application' version '8.13.2'
    id 'com.chaquo.python' version '17.2.0'
}

android {
    namespace 'br.cellcount.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.cellcount.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        def caminhoPython = providers.gradleProperty('cellcountPython').orNull
        if (caminhoPython) {
            buildPython(caminhoPython)
        }
        pip { install 'Pillow==11.0.0' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
