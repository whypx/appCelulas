plugins {
    id 'com.android.application' version '8.13.2'
    id 'com.chaquo.python' version '17.2.0'
}

android {
    namespace 'br.cellcount.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.cellcount.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def pastaNucleo = layout.buildDirectory.dir('nucleoPython')
def copiarNucleo = tasks.register('copiarNucleo', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'contador.py', 'analises.py'
    }
    into(pastaNucleo)
}

chaquopy {
    defaultConfig {
        version = '3.13'
        def pythonLocal = rootProject.file('../.venv313/Scripts/python.exe')
        if (pythonLocal.isFile()) {
            buildPython(pythonLocal.absolutePath)
        }
        pip { install 'Pillow==11.0.0' }
    }
    sourceSets.getByName('main').srcDir(pastaNucleo.get().asFile)
}

tasks.configureEach {
    if (name.endsWith('PythonSources')) {
        dependsOn(copiarNucleo)
        inputs.files(copiarNucleo)
    }
    if (it instanceof JavaCompile) {
        options.encoding = 'UTF-8'
    }
}
